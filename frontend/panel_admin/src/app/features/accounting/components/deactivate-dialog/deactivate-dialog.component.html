<div class="modal-header">
  <h4 class="modal-title">{{ 'ACCOUNTING.DEACTIVATE_DIALOG.TITULO' | translate }}</h4>
  <button type="button" class="btn-close" [attr.aria-label]="'COMMON.CERRAR' | translate" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body">
  @if (blocked) {
  <div class="alert alert-warning mb-0" role="alert" data-testid="blocked">
    {{ 'ACCOUNTING.DEACTIVATE_DIALOG.BLOQUEADA' | translate: { methods: methodNames } }}
  </div>
  } @else {
  <p class="mb-0" data-testid="confirmation">{{ 'ACCOUNTING.DEACTIVATE_DIALOG.CONFIRMACION' | translate: { name: account.name } }}</p>
  }
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-light" (click)="activeModal.dismiss()">{{ 'COMMON.CANCELAR' | translate }}</button>
  <button type="button" class="btn btn-primary" [disabled]="blocked" (click)="activeModal.close(true)">{{ 'ACCOUNTING.DEACTIVATE_DIALOG.DESACTIVAR' | translate }}</button>
</div>
