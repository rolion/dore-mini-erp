<div class="card">
  <div class="card-header">
    <h4>Historial de compras</h4>
  </div>
  <div class="card-body">
    @if (orders().length) {
    <div class="table-responsive">
      <table class="table table-striped m-b-0">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Total</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody>
          @for (order of orders(); track order.id) {
          <tr>
            <td>{{ order.date | date: 'dd/MM/yyyy' }}</td>
            <td>{{ order.total }}</td>
            <td>{{ order.status }}</td>
          </tr>
          }
        </tbody>
      </table>
    </div>
    } @else {
    <p class="m-4">Este cliente aún no tiene pedidos.</p>
    }
  </div>
</div>
