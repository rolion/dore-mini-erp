<form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <div class="modal-header">
    <h4 class="modal-title">{{ isEdit ? 'Editar categoría' : 'Nueva categoría' }}</h4>
    <button type="button" class="btn-close" aria-label="Cerrar" (click)="activeModal.dismiss()"></button>
  </div>
  <div class="modal-body">
    <div class="form-group">
      <label for="category-name">Nombre <span class="text-danger">*</span></label>
      <input id="category-name" type="text" class="form-control" placeholder="Nombre de la categoría"
        formControlName="name" [attr.maxlength]="nameMaxLength" autofocus>
      @if (hasError()) {
      <small class="form-text text-danger">
        {{ serverError || (form.controls.name.hasError('maxlength') ?
        'El nombre no puede superar ' + nameMaxLength + ' caracteres.' : 'El nombre es obligatorio.') }}
      </small>
      }
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-light" (click)="activeModal.dismiss()">Cancelar</button>
    <button type="submit" class="btn btn-primary" [disabled]="form.invalid || saving">Guardar</button>
  </div>
</form>
