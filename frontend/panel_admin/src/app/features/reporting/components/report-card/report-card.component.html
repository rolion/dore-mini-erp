<div class="card">
  <div class="card-header">
    <h4>{{ title() }}</h4>
    @if (subtitle()) {
    <small class="text-muted ms-3">{{ subtitle() }}</small>
    }
  </div>
  <div class="card-body">
    @switch (status()) {
    @case ('loading') {
    <p class="mb-0" data-testid="card-loading">Cargando…</p>
    }
    @case ('error') {
    <div class="d-flex align-items-center gap-3" data-testid="card-error">
      <span class="text-danger">{{ error() || 'No se pudo cargar.' }}</span>
      <button type="button" class="btn btn-light btn-sm" (click)="retry.emit()">Reintentar</button>
    </div>
    }
    @case ('ready') {
    <ng-content />
    }
    }
  </div>
</div>
