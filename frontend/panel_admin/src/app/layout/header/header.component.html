<nav class="navbar navbar-expand-lg main-navbar sticky">
  <div class="form-inline me-auto">
    <ul class="navbar-nav msr-3">
      <li>
        <a data-toggle="sidebar" class="nav-link nav-link-lg
          collapse-btn" (click)="mobileMenuSidebarOpen($event,'overlay-open')">
          <i-feather name="menu"></i-feather>
        </a>
      </li>
    </ul>
  </div>
  <ul class="navbar-nav navbar-right">
    <li> <a class="nav-link nav-link-lg
      collapse-btn" (click)="callFullscreen()">
      <i-feather name="maximize"></i-feather>
    </a>
    </li>
    <li class="dropdown dropdown-list-toggle" ngbDropdown>
      <a data-toggle="dropdown" class="nav-link nav-link-lg lang-toggle remove-caret" ngbDropdownToggle>
        @if (flagvalue !== undefined) {
          <img src="{{flagvalue}}" alt="Header Language" height="16">
        }
        @if (flagvalue === undefined) {
          <img src="{{defaultFlag}}" alt="Header Language" height="16">
        }
      </a>
      <div class="dropdown-menu header-dropdown dropdown-menu-right lang-dropdown-list pullDown" ngbDropdownMenu>
        @for (item of listLang; track item) {
          <a href="javascript:void(0);" class="dropdown-item lang-item-list"
            (click)="setLanguage(item.text, item.lang, item.flag)" [ngClass]="{'active': langStoreValue === item.lang}">
            <img src="{{item.flag}}" alt="user-image" class="msr-1" height="12"> <span
            class="align-middle">{{item.text}}</span>
          </a>
        }
      </div>
    </li>
    <li ngbDropdown><a ngbDropdownToggle data-toggle="dropdown"
      class="nav-link dropdown-toggle nav-link-lg nav-link-user user-toggle">
      <app-user-avatar [initials]="userInitials" [label]="userDisplayName" size="sm" />
    </a>
      <div ngbDropdownMenu class="dropdown-menu dropdown-menu-right header-dropdown pullDown">
        <div class="dropdown-title">{{ userDisplayName }}</div>
        @if (companyName) {
          <div class="dropdown-item-text text-muted small px-3 pb-2 company-name">{{ companyName }}</div>
        }
        <div class="dropdown-divider"></div>
        <a href="javascript:void(0);" class="dropdown-item has-icon text-danger logout-item" (click)="logout()"> <i
          class="fas fa-sign-out-alt"></i>
          Logout
        </a>
      </div>
    </li>
  </ul>
</nav>
